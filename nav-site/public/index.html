<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🔗 网址导航 · 登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      color: #1f2937;
    }
    .card {
      width: 360px; max-width: 92vw; background: #fff; border-radius: 18px;
      padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { text-align: center; margin: 0 0 4px; font-size: 26px; }
    .sub { text-align: center; color: #6b7280; margin: 0 0 22px; font-size: 13px; }
    h2 { font-size: 17px; margin: 0 0 14px; }
    label { display: block; font-size: 13px; color: #374151; margin: 12px 0 6px; }
    input {
      width: 100%; padding: 11px 13px; border: 1px solid #d1d5db; border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #8b5cf6; }
    button {
      width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .92; }
    .msg { min-height: 18px; margin: 12px 0 0; font-size: 13px; text-align: center; }
    .msg.err { color: #dc2626; }
    .switch { text-align: center; margin-top: 16px; font-size: 13px; color: #6b7280; }
    .switch a { color: #8b5cf6; cursor: pointer; text-decoration: none; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 网址导航</h1>
    <p class="sub">私有导航 · 登录可见</p>

    <!-- 注册视图 -->
    <div id="registerView">
      <h2>首次注册</h2>
      <form id="registerForm" autocomplete="off">
        <label>用户名</label>
        <input name="username" placeholder="设置一个用户名" required />
        <label>密码</label>
        <input name="password" type="password" placeholder="至少 6 位" required />
        <button type="submit">注册并进入</button>
      </form>
      <p class="msg" id="regMsg"></p>
    </div>

    <!-- 登录视图 -->
    <div id="loginView" class="hidden">
      <h2>登录</h2>
      <form id="loginForm" autocomplete="off">
        <label>用户名</label>
        <input name="username" placeholder="用户名" required />
        <label>密码</label>
        <input name="password" type="password" placeholder="密码" required />
        <button type="submit">登录</button>
      </form>
      <p class="msg" id="loginMsg"></p>
    </div>

    <p class="switch" id="switch"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(url, opts = {}) {
      const r = await fetch(url, { credentials: 'same-origin', ...opts });
      let data = {};
      try { data = await r.json(); } catch {}
      return { ok: r.ok, status: r.status, data };
    }

    function setMsg(el, text, type) {
      el.textContent = text || '';
      el.className = 'msg' + (type ? ' ' + type : '');
    }

    (async () => {
      const me = await api('/api/me');
      if (me.data.authed) { location.href = '/app.html'; return; }

      const st = await api('/api/status');
      const sw = $('switch');
      if (st.status !== 200) {
        sw.innerHTML = '⚠ 后端接口异常 (HTTP ' + st.status + ')：请检查部署是否包含 Worker 代码、KV(NAV_KV) 是否已绑定';
        return;
      }
      const registered = !!st.data.registered;
      const regView = $('registerView');
      const loginView = $('loginView');

      if (registered) {
        regView.classList.add('hidden');
        loginView.classList.remove('hidden');
        sw.innerHTML = '还没有账号？ <a id="toReg">去注册</a>';
        $('toReg').onclick = () => location.reload();
      } else {
        regView.classList.remove('hidden');
        loginView.classList.add('hidden');
        sw.innerHTML = '已经注册过？ <a id="toLogin">去登录</a>';
        $('toLogin').onclick = () => location.reload();
      }
    })();

    $('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      setMsg($('regMsg'), '注册中…');
      const { ok, status, data } = await api('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }),
      });
      if (ok) location.href = '/app.html';
      else setMsg($('regMsg'), (data.error || '注册失败') + ` (HTTP ${status})`, 'err');
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      setMsg($('loginMsg'), '登录中…');
      const { ok, status, data } = await api('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }),
      });
      if (ok) location.href = '/app.html';
      else setMsg($('loginMsg'), (data.error || '登录失败') + ` (HTTP ${status})`, 'err');
    });
  </script>
</body>
</html>
