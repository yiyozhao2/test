name = "my-nav"
# Pages 项目的静态文件就在本目录
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# KV 命名空间绑定（把 id 换成你自己的 KV 命名空间 ID）
[[kv_namespaces]]
binding = "NAV_KV"
id = "35adffea216349bcab42dc1643df3360"

# AUTH_SECRET 是签名会话 Cookie 的密钥，请用命令设置（不要写在这里）：
#   wrangler secret put AUTH_SECRET --pages
# 本地开发可在 .dev.vars 里写： AUTH_SECRET=你的随机字符串
