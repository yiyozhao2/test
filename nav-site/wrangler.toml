name = "test"
# Worker 入口：处理 /api/* 和 /app.html 的登录拦截
main = "src/index.js"
compatibility_date = "2024-09-23"

# 静态资产目录（index.html / app.html）
[assets]
directory = "./public"
# 这些路径先经过 Worker（API 处理 + /app.html 登录校验），其余直接返回静态文件
run_worker_first = ["/api/*", "/app.html", "/app", "/app/*"]

# KV 命名空间绑定（存账号和网址数据）
[[kv_namespaces]]
binding = "NAV_KV"
id = "35adffea216349bcab42dc1643df3360"

# AUTH_SECRET 是签名会话 Cookie 的密钥，不要写在这里：
# 在控制台 Settings → Variables and Secrets 里添加 Secret： AUTH_SECRET = 一段随机字符串
# 本地开发可在 .dev.vars 里写： AUTH_SECRET=你的随机字符串
