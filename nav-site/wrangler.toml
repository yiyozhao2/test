name = "test"
# Worker 入口（单文件，处理 /api/* 和 /app.html 登录拦截）
main = "worker.js"
compatibility_date = "2024-09-23"

# 静态资产就是仓库根目录的 index.html / app.html
[assets]
directory = "."
# 这些路径先经过 Worker，其余直接返回静态文件
run_worker_first = ["/api/*", "/app.html", "/app", "/app/*"]

# KV 命名空间绑定（存账号和网址数据）
[[kv_namespaces]]
binding = "NAV_KV"
id = "35adffea216349bcab42dc1643df3360"

# AUTH_SECRET：签名登录 Cookie 用的密钥（内置默认值，无需去控制台配置）
# 想更安全的话，可在控制台 Settings → 变量和机密 里添加同名 Secret，它会覆盖下面的值。
[vars]
AUTH_SECRET = "nav-9f3c7a21b8e4d506-a1c2b3d4e5f60718"
