<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🔗 网址导航</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f172a; --panel: #1e293b; --card: #273449; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #8b5cf6; --accent2: #6366f1; --danger: #ef4444;
    }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; border-bottom: 1px solid #334155; position: sticky; top: 0;
      background: rgba(15,23,42,.85); backdrop-filter: blur(8px); z-index: 10;
    }
    header .title { font-size: 20px; font-weight: 700; }
    header .actions { display: flex; gap: 10px; }
    .btn {
      padding: 9px 16px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s, transform .05s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; }
    .btn-ghost { background: #334155; color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:hover { opacity: .92; }

    main { padding: 26px 28px 60px; max-width: 1200px; margin: 0 auto; }
    .group-title {
      font-size: 14px; color: var(--muted); margin: 26px 0 12px; text-transform: uppercase;
      letter-spacing: .04em; font-weight: 700;
    }
    .grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    }
    .card {
      background: var(--card); border-radius: 14px; padding: 16px; text-decoration: none;
      color: var(--text); display: flex; flex-direction: column; gap: 8px; position: relative;
      border: 1px solid #334155; transition: transform .12s, border-color .12s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card .row { display: flex; align-items: center; gap: 10px; }
    .card .ic {
      width: 34px; height: 34px; border-radius: 9px; background: #334155; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden;
    }
    .card .ic img { width: 100%; height: 100%; object-fit: cover; }
    .card .name { font-weight: 600; font-size: 15px; word-break: break-all; }
    .card .desc { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .card .ops {
      position: absolute; top: 8px; right: 8px; display: none; gap: 6px;
    }
    .card:hover .ops { display: flex; }
    .card .ops button {
      border: 0; border-radius: 7px; width: 26px; height: 26px; cursor: pointer; font-size: 12px;
      background: #0f172a; color: var(--text);
    }
    .card .ops button.del:hover { background: var(--danger); }

    .empty { color: var(--muted); text-align: center; padding: 60px 0; }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
      align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel); border-radius: 16px; padding: 24px; width: 440px; max-width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .modal h3 { margin: 0 0 18px; font-size: 18px; }
    .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    .modal input, .modal textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #475569; border-radius: 9px;
      background: #0f172a; color: var(--text); font-size: 14px; outline: none;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
    .modal .foot { display: flex; gap: 10px; margin-top: 20px; }
    .modal .foot .btn { flex: 1; }
    .modal .msg { min-height: 16px; font-size: 13px; margin-top: 10px; }
    .modal .msg.err { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <div class="title">🔗 我的网址导航</div>
    <div class="actions">
      <button class="btn btn-primary" id="addBtn">+ 添加网址</button>
      <button class="btn btn-ghost" id="logoutBtn">退出</button>
    </div>
  </header>

  <main id="main">
    <div class="empty" id="loading">加载中…</div>
  </main>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <h3 id="modalTitle">添加网址</h3>
      <form id="linkForm">
        <input type="hidden" name="id" />
        <label>名称 *</label>
        <input name="name" placeholder="例如：Gmail" required />
        <label>网址 *</label>
        <input name="url" placeholder="例如：mail.google.com" required />
        <label>分组</label>
        <input name="group" placeholder="默认" />
        <label>图标 URL（留空则自动取网站 favicon）</label>
        <input name="icon" placeholder="https://…/icon.png" />
        <label>描述</label>
        <textarea name="description" rows="2" placeholder="可选"></textarea>
        <div class="msg" id="formMsg"></div>
        <div class="foot">
          <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(url, opts = {}) {
      const r = await fetch(url, { credentials: 'same-origin', ...opts });
      let data = {};
      try { data = await r.json(); } catch {}
      return { ok: r.ok, status: r.status, data };
    }

    function favicon(url, icon) {
      if (icon) return icon;
      try {
        const host = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url).hostname;
        return 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
      } catch {
        return '';
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let links = [];

    async function load() {
      const { ok, status, data } = await api('/api/links');
      if (!ok) {
        if (status === 401) { location.href = '/'; return; }
        $('main').innerHTML = '<div class="empty">加载失败</div>';
        return;
      }
      links = data;
      render();
    }

    function render() {
      if (!links.length) {
        $('main').innerHTML = '<div class="empty">还没有网址，点右上角「+ 添加网址」开始吧</div>';
        return;
      }
      const groups = {};
      for (const l of links) {
        (groups[l.group || '默认'] = groups[l.group || '默认'] || []).push(l);
      }
      let html = '';
      for (const g of Object.keys(groups)) {
        html += '<div class="group-title">' + esc(g) + '</div><div class="grid">';
        for (const l of groups[g]) {
          const ic = favicon(l.url, l.icon);
          html +=
            '<a class="card" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
              '<div class="ops">' +
                '<button class="edit" data-id="' + l.id + '" title="编辑">✎</button>' +
                '<button class="del" data-id="' + l.id + '" title="删除">🗑</button>' +
              '</div>' +
              '<div class="row">' +
                '<div class="ic">' + (ic ? '<img src="' + esc(ic) + '" onerror="this.style.display=\'none\'">' : '🔗') + '</div>' +
                '<div class="name">' + esc(l.name) + '</div>' +
              '</div>' +
              (l.description ? '<div class="desc">' + esc(l.description) + '</div>' : '') +
            '</a>';
        }
        html += '</div>';
      }
      $('main').innerHTML = html;

      $('main').querySelectorAll('.edit').forEach((b) =>
        b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openEdit(b.dataset.id); }));
      $('main').querySelectorAll('.del').forEach((b) =>
        b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); delLink(b.dataset.id); }));
    }

    function openModal(title) {
      $('modalTitle').textContent = title;
      $('formMsg').textContent = '';
      $('modal').classList.add('show');
    }
    function closeModal() {
      $('modal').classList.remove('show');
      $('linkForm').reset();
      $('linkForm').id.value = '';
    }

    $('addBtn').onclick = () => openModal('添加网址');
    $('cancelBtn').onclick = closeModal;
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

    function openEdit(id) {
      const l = links.find((x) => x.id === id);
      if (!l) return;
      const f = $('linkForm');
      f.id.value = l.id;
      f.name.value = l.name;
      f.url.value = l.url;
      f.group.value = l.group || '';
      f.icon.value = l.icon || '';
      f.description.value = l.description || '';
      openModal('编辑网址');
    }

    async function delLink(id) {
      if (!confirm('确定删除该网址？')) return;
      const { ok, data } = await api('/api/links/' + id, { method: 'DELETE' });
      if (ok) load();
      else alert(data.error || '删除失败');
    }

    $('linkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const payload = {
        name: f.name.value, url: f.url.value, group: f.group.value,
        icon: f.icon.value, description: f.description.value,
      };
      const id = f.id.value;
      const { ok, data } = id
        ? await api('/api/links/' + id, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
          })
        : await api('/api/links', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
          });
      if (ok) { closeModal(); load(); }
      else $('formMsg').textContent = data.error || '保存失败';
    });

    $('logoutBtn').onclick = async () => {
      await api('/api/logout', { method: 'POST' });
      location.href = '/';
    };

    load();
  </script>
</body>
</html>
